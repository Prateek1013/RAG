spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/auth/**
        - id: file-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/file/**
        - id: doc-processor
          uri: http://localhost:8000
          predicates:
            - Path=/api/doc/**
          filters:
            - RewritePath=/api/doc/(?<segment>.*), /$\{segment}
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
server:
  port: 8081

security:
  jwt:
    secret: "${JWT_SECRET_KEY}"